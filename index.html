<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Okur — Okuma Takibi</title>
  <meta name="description" content="Okuma alışkanlığı kazandıran kitap takip uygulaması: seri, hedefler, okuma takvimi, zamanlayıcı ve alıntı defteri.">
  <meta name="theme-color" content="#050508">
  <meta name="color-scheme" content="dark light">

  <!-- iOS Safari PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Okur">
  <meta name="format-detection" content="telephone=no">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <!-- Tema, ilk boyamadan önce uygulanır (yanıp sönme olmaz) -->
  <script>
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('okur:settings') || '{}');
        var m = s.mode || 'system';
        if (m === 'system') m = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        var r = document.documentElement;
        r.setAttribute('data-mode', m);
        r.setAttribute('data-theme', s.theme || 'ocean');
        r.setAttribute('data-ui', s.uiStyle || 'normal');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', m === 'light' ? '#f2f2f7' : '#000000');
        document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').setAttribute('content', m === 'light' ? 'default' : 'black-translucent');
      } catch (e) {}
    })();
  </script>

  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://wsrv.nl">
  <link rel="dns-prefetch" href="https://books.google.com">
  <link rel="dns-prefetch" href="https://covers.openlibrary.org">

  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/liquid-glass.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/animations.css">

  <link rel="modulepreload" href="/js/app.js">
  <link rel="modulepreload" href="/js/firebase-config.js">
  <link rel="modulepreload" href="/js/ui-components.js">
  <link rel="modulepreload" href="/js/stats-engine.js">
  <link rel="modulepreload" href="/js/api-books.js">
</head>
<body>
  <!-- Paylaşılan SVG tanımları (alev gradyanı) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="flameGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffcf6b"/>
        <stop offset=".55" stop-color="#f4924a"/>
        <stop offset="1" stop-color="#e5604a"/>
      </linearGradient>
    </defs>
  </svg>

  <!-- Dinamik ortam ışığı (kapak renklerinden) -->
  <div class="ambient" aria-hidden="true">
    <span class="glow"></span>
  </div>

  <!-- Uygulama kabuğu -->
  <div id="app" class="app-shell">
    <main id="view" class="view-root" aria-live="polite"></main>
    <nav id="tabbar" class="tabbar" aria-label="Ana gezinme"></nav>
  </div>

  <!-- Dinamik Ada okuma zamanlayıcısı -->
  <div id="island" class="island" hidden></div>

  <!-- Bottom sheet ve toast katmanları -->
  <div id="sheets" class="sheets"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <!-- Açılış -->
  <div id="splash" class="splash" aria-hidden="true">
    <img class="splash-mark" src="/icons/icon.svg" alt="" width="92" height="92">
  </div>

  <noscript>
    <p style="position:fixed;inset:0;display:grid;place-items:center;color:#fff;font:17px -apple-system,sans-serif;text-align:center;padding:24px">
      Okur'u kullanmak için JavaScript'i etkinleştirin.
    </p>
  </noscript>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
